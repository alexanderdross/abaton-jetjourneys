name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Next build
        run: npm run build

      # Blocks only on critical advisories. The tree currently carries high
      # advisories transitively from Next (sharp/libvips, postcss) that have no
      # non-breaking fix and are unused at runtime on Workers (custom image
      # loader), so a "high" gate would fail on issues we cannot act on.
      - name: Security audit (critical)
        run: npm audit --audit-level=critical

  workers-build:
    name: Cloudflare Workers bundle (OpenNext)
    runs-on: ubuntu-latest
    # Verifies the real deploy-target build; kept separate so test feedback stays fast.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Workers bundle
        run: npx opennextjs-cloudflare build
